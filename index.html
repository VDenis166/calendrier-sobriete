<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calendrier Sobriété Chic 2026</title>

  <style>
    :root{
      --ink:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --card:#ffffff;
      --soft:#f9fafb;

      /* Accent demandé */
      --accent:#f4baa4ff; /* si besoin: #f4baa4 */
      --starOff:#d1d5db;

      --radius:16px;
    }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--ink);
      background: linear-gradient(180deg, #fff, #fafafa);
    }

    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 36px;
    }

    .header{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:flex-end;
      justify-content:space-between;
      margin-bottom: 14px;
    }

    .title{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width: 280px;
    }
    .title h1{
      margin:0;
      font-size: 20px;
      letter-spacing:-0.02em;
    }
    .title p{
      margin:0;
      color:var(--muted);
      font-size: 13px;
      line-height:1.35;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }

    button{
      border:1px solid var(--border);
      background:var(--card);
      padding:10px 12px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
      cursor:pointer;
    }
    button:hover{ background:var(--soft); }

    /* Bande de félicitations */
    .congrats{
      display:none;
      border:1px solid rgba(0,0,0,.06);
      background: linear-gradient(180deg, rgba(244,186,164,.30), rgba(244,186,164,.12));
      border-radius: var(--radius);
      padding: 12px 14px;
      margin: 10px 0 16px;
      box-shadow: 0 6px 22px rgba(0,0,0,.05);
    }
    .congrats.show{ display:block; }
    .congrats .top{
      display:flex;
      gap:10px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .congrats .msg{
      font-weight:800;
      letter-spacing:-0.01em;
      font-size: 14px;
    }
    .congrats .sub{
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
      line-height:1.35;
    }
    .congrats .badge{
      background: var(--accent);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space:nowrap;
    }

    /* Objectif (1 panneau) */
    .goalPanel{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      margin: 10px 0 16px;
    }

    .panel{
      border:1px solid var(--border);
      background:var(--card);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.04);
    }
    .panelTop{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom: 10px;
      flex-wrap:wrap;
    }
    .panelTitle{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width: 240px;
    }
    .panelTitle .kicker{
      font-size: 12px;
      color: var(--muted);
    }
    .panelTitle .value{
      font-size: 16px;
      font-weight: 800;
      letter-spacing:-0.01em;
    }

    .chip{
      border:1px solid var(--border);
      background:var(--card);
      padding:10px 12px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
      display:flex;
      gap:10px;
      align-items:center;
      color:var(--muted);
      height: fit-content;
    }
    .chip strong{ color:var(--ink); font-weight:700; }

    /* Stars */
    .starsWrap{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width: 260px;
      align-items:flex-end;
    }
    .stars{
      display:flex;
      gap:6px;
      align-items:center;
    }
    .star{
      width: 22px;
      height: 22px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size: 18px;
      line-height: 1;
      color: var(--starOff);
      filter: grayscale(1);
      opacity: .85;
      transition: transform .15s ease, filter .15s ease, opacity .15s ease, color .15s ease;
    }
    .star.on{
      color: var(--accent);
      filter: grayscale(0);
      opacity: 1;
      transform: translateY(-1px);
    }
    .starsLegend{
      font-size: 11px;
      color: var(--muted);
      text-align:right;
      line-height:1.25;
    }

    .bar{
      height: 10px;
      border-radius: 999px;
      background: #f1f5f9;
      overflow:hidden;
      border:1px solid var(--border);
    }
    .fill{
      height:100%;
      width:0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width .25s ease;
    }
    .panelFoot{
      display:flex;
      justify-content:space-between;
      margin-top:8px;
      font-size: 12px;
      color: var(--muted);
      gap:10px;
      flex-wrap:wrap;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(12, minmax(240px, 1fr));
      gap: 14px;
    }

    @media (max-width: 1400px){
      .grid{ grid-template-columns: repeat(3, minmax(240px, 1fr)); }
    }
    @media (max-width: 900px){
      .grid{ grid-template-columns: repeat(2, minmax(240px, 1fr)); }
      .starsWrap{ align-items:flex-start; }
      .starsLegend{ text-align:left; }
    }
    @media (max-width: 560px){
      .grid{ grid-template-columns: 1fr; }
    }

    .month{
      border:1px solid var(--border);
      background:var(--card);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.04);
    }

    .monthHead{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      padding: 12px 14px;
      background: #fff;
      border-bottom:1px solid var(--border);
      gap:10px;
    }
    .monthName{
      font-weight:800;
      letter-spacing:-0.01em;
    }
    .monthMeta{
      color:var(--muted);
      font-size:12px;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .monthMini{
      padding: 2px 10px;
      border:1px solid var(--border);
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      min-width: 34px;
      text-align:center;
    }
    .monthMini strong{ color: var(--ink); }

    .dow{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:6px;
      padding: 10px 12px 6px;
      color:var(--muted);
      font-size: 11px;
      user-select:none;
    }
    .dow div{ text-align:center; }

    .days{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:6px;
      padding: 6px 12px 12px;
    }

    .day, .empty{
      height: 34px;
      border-radius: 10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 13px;
      border:1px solid var(--border);
      background: #fff;
      user-select:none;
    }
    .empty{
      border:1px dashed transparent;
      background: transparent;
    }

    .day{
      cursor:pointer;
      transition: transform .05s ease, background .15s ease, border-color .15s ease;
    }
    .day:hover{
      background: var(--soft);
      transform: translateY(-1px);
    }

    /* Jours marqués: couleur uniquement (pas de coche) */
    .day.marked{
      background: var(--accent);
      border-color: var(--accent);
      color: var(--ink);
    }

    .legend{
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1>Calendrier Sobriété Chic 2026</h1>
        <p>Cliquez sur un jour pour le colorer (enregistré automatiquement sur ce navigateur).</p>
      </div>

      <div class="controls">
        <button id="clearBtn" type="button">Réinitialiser</button>
      </div>
    </div>

    <!-- Félicitations -->
    <div id="congrats" class="congrats">
      <div class="top">
        <div>
          <div id="congratsMsg" class="msg">Bravo ✨</div>
          <div id="congratsSub" class="sub"></div>
        </div>
        <div id="congratsBadge" class="badge">Niveau</div>
      </div>
    </div>

    <!-- Total + étoiles -->
    <div class="goalPanel">
      <div class="panel" id="goalPanel">
        <div class="panelTop">
          <div class="panelTitle">
            <div class="kicker">Total</div>
            <div class="value"><span id="goalCount">0</span> jours sans alcool</div>
          </div>

          <div class="starsWrap">
            <div class="stars" aria-label="Niveaux">
              <span class="star" id="star1" title="1 étoile : 7 jours">★</span>
              <span class="star" id="star2" title="2 étoiles : 15 jours">★</span>
              <span class="star" id="star3" title="3 étoiles : 30 jours">★</span>
              <span class="star" id="star4" title="4 étoiles : 45 jours">★</span>
              <span class="star" id="star5" title="5 étoiles : 60 jours">★</span>
            </div>
            <div class="starsLegend" id="starsLegend">
              1★=7 • 2★=15 • 3★=30 • 4★=45 • 5★=60
            </div>
          </div>

          <div class="chip" title="Total sur 2026 (ce navigateur)">
            Total : <strong id="countYear">0</strong>
          </div>
        </div>

        <div class="bar"><div class="fill" id="goalFill"></div></div>

        <div class="panelFoot">
          <div id="goalRemaining">—</div>
          <div id="nextStar">—</div>
        </div>
      </div>
    </div>

    <div id="calendar" class="grid"></div>

    <div class="legend">
      ✅ Re-cliquer sur un jour = enlever la couleur.
    </div>
  </div>

  <script>
    (function(){
      const YEAR = 2026;
      const STORAGE_KEY = "sobriete_calendar_" + YEAR;

      // Paliers étoiles basés sur le TOTAL
      const MILESTONES = [
        { days: 7,  stars: 1 },
        { days: 15, stars: 2 },
        { days: 30, stars: 3 },
        { days: 45, stars: 4 },
        { days: 60, stars: 5 },
      ];

      function nextMilestone(total){
        return MILESTONES.find(m => total < m.days) || null;
      }
      function currentMilestone(total){
        let cur = null;
        for(const m of MILESTONES){
          if(total >= m.days) cur = m;
        }
        return cur;
      }

      const monthNames = [
        "Janvier","Février","Mars","Avril","Mai","Juin",
        "Juillet","Août","Septembre","Octobre","Novembre","Décembre"
      ];
      const dow = ["L","M","M","J","V","S","D"];

      const marked = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

      const calendarEl = document.getElementById("calendar");
      const clearBtn = document.getElementById("clearBtn");

      const goalCountEl = document.getElementById("goalCount");
      const countYearEl = document.getElementById("countYear");
      const goalFillEl = document.getElementById("goalFill");
      const goalRemainingEl = document.getElementById("goalRemaining");
      const nextStarEl = document.getElementById("nextStar");

      const stars = [
        document.getElementById("star1"),
        document.getElementById("star2"),
        document.getElementById("star3"),
        document.getElementById("star4"),
        document.getElementById("star5"),
      ];

      const congratsEl = document.getElementById("congrats");
      const congratsMsgEl = document.getElementById("congratsMsg");
      const congratsSubEl = document.getElementById("congratsSub");
      const congratsBadgeEl = document.getElementById("congratsBadge");

      function pad2(n){ return String(n).padStart(2,"0"); }
      function isoDate(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; } // m: 1-12

      function save(){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(marked)));
      }

      function weekdayMondayFirst(date){
        return (date.getDay() + 6) % 7;
      }

      function clampPct(part, total){
        if(total <= 0) return 0;
        const p = Math.round((part / total) * 100);
        return Math.max(0, Math.min(100, p));
      }

      function countInMonth(year, monthIndex){
        const daysInMonth = new Date(year, monthIndex+1, 0).getDate();
        let c = 0;
        for(let day=1; day<=daysInMonth; day++){
          const id = isoDate(year, monthIndex+1, day);
          if(marked.has(id)) c++;
        }
        return c;
      }

      function updateStars(total){
        const thresholds = MILESTONES.map(m => m.days);
        thresholds.forEach((t, i) => {
          if(total >= t) stars[i].classList.add("on");
          else stars[i].classList.remove("on");
        });
      }

      function updateCongrats(total){
        const cur = currentMilestone(total);
        if(!cur){
          congratsEl.classList.remove("show");
          return;
        }

        congratsEl.classList.add("show");
        congratsBadgeEl.textContent = `${cur.stars}★`;

        if(cur.stars === 1){
          congratsMsgEl.textContent = "Bravo ✨ 1 étoile obtenue";
          congratsSubEl.textContent = "7 jours au total. Une première marche solide — continuez.";
        } else if(cur.stars === 2){
          congratsMsgEl.textContent = "Magnifique ✨ 2 étoiles";
          congratsSubEl.textContent = "15 jours au total. Votre constance devient une signature.";
        } else if(cur.stars === 3){
          congratsMsgEl.textContent = "Incroyable ✨ 3 étoiles";
          congratsSubEl.textContent = "30 jours au total. Vous installez un nouveau standard.";
        } else if(cur.stars === 4){
          congratsMsgEl.textContent = "Exceptionnel ✨ 4 étoiles";
          congratsSubEl.textContent = "45 jours au total. C’est une transformation profonde.";
        } else {
          congratsMsgEl.textContent = "Légendaire ✨ 5 étoiles";
          congratsSubEl.textContent = "60 jours au total. Une vraie liberté intérieure.";
        }
      }

      function updateGoalUI(){
        const total = marked.size;

        goalCountEl.textContent = total;
        countYearEl.textContent = total;

        updateStars(total);
        updateCongrats(total);

        const next = nextMilestone(total);

        if(next){
          goalFillEl.style.width = clampPct(total, next.days) + "%";
          const remaining = next.days - total;
          goalRemainingEl.textContent = `Prochain palier : ${next.days} jours`;
          nextStarEl.textContent = `Encore ${remaining} jour(s) pour ${next.stars}★`;
        } else {
          goalFillEl.style.width = "100%";
          goalRemainingEl.textContent = "Tous les paliers sont atteints ✨";
          nextStarEl.textContent = "5★ acquis";
        }
      }

      function buildMonth(monthIndex){
        const monthCard = document.createElement("section");
        monthCard.className = "month";

        const head = document.createElement("div");
        head.className = "monthHead";

        const title = document.createElement("div");
        title.className = "monthName";
        title.textContent = monthNames[monthIndex];

        const meta = document.createElement("div");
        meta.className = "monthMeta";

        const monthCount = countInMonth(YEAR, monthIndex);
        const metaPill = document.createElement("div");
        metaPill.className = "monthMini";
        metaPill.innerHTML = `<strong id="mcount-${monthIndex}">${monthCount}</strong>`;

        const yearTxt = document.createElement("span");
        yearTxt.textContent = YEAR;

        meta.appendChild(metaPill);
        meta.appendChild(yearTxt);

        head.appendChild(title);
        head.appendChild(meta);

        const dowRow = document.createElement("div");
        dowRow.className = "dow";
        dow.forEach(x => {
          const d = document.createElement("div");
          d.textContent = x;
          dowRow.appendChild(d);
        });

        const daysGrid = document.createElement("div");
        daysGrid.className = "days";

        const first = new Date(YEAR, monthIndex, 1);
        const startOffset = weekdayMondayFirst(first);
        const daysInMonth = new Date(YEAR, monthIndex + 1, 0).getDate();

        for(let i=0;i<startOffset;i++){
          const empty = document.createElement("div");
          empty.className = "empty";
          daysGrid.appendChild(empty);
        }

        for(let day=1; day<=daysInMonth; day++){
          const id = isoDate(YEAR, monthIndex+1, day);
          const cell = document.createElement("div");
          cell.className = "day";
          cell.textContent = day;

          if(marked.has(id)) cell.classList.add("marked");

          cell.addEventListener("click", () => {
            if(marked.has(id)){
              marked.delete(id);
              cell.classList.remove("marked");
            } else {
              marked.add(id);
              cell.classList.add("marked");
            }
            save();

            const mcountEl = document.getElementById(`mcount-${monthIndex}`);
            if(mcountEl){
              mcountEl.textContent = countInMonth(YEAR, monthIndex);
            }

            updateGoalUI();
          });

          daysGrid.appendChild(cell);
        }

        monthCard.appendChild(head);
        monthCard.appendChild(dowRow);
        monthCard.appendChild(daysGrid);
        return monthCard;
      }

      function render(){
        calendarEl.innerHTML = "";
        for(let m=0; m<12; m++){
          calendarEl.appendChild(buildMonth(m));
        }
        updateGoalUI();
        save();
      }

      clearBtn.addEventListener("click", () => {
        if(confirm("Réinitialiser toutes les journées marquées pour 2026 ?")){
          marked.clear();
          save();
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
