<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calendrier Sobriété Chic 2026</title>

  <style>
    :root{
      --ink:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --card:#ffffff;
      --soft:#f9fafb;
      --accent:#f4baa4ff;
      --starOff:#d1d5db;
      --radius:16px;
    }

    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:#fafafa;
      color:var(--ink);
    }

    .wrap{max-width:1100px;margin:auto;padding:20px 16px 40px;}
    h1{margin:0;font-size:20px}
    p{margin:4px 0 0;color:var(--muted);font-size:13px}

    button{
      border:1px solid var(--border);
      background:#fff;
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
    }

    .panel{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      margin:16px 0;
    }

    .stars span{
      font-size:20px;
      color:var(--starOff);
      margin-right:4px;
    }
    .stars span.on{color:var(--accent)}

    .bar{
      height:10px;
      background:#f1f5f9;
      border-radius:999px;
      overflow:hidden;
      margin-top:10px;
    }
    .fill{
      height:100%;
      background:var(--accent);
      width:0%;
      transition:.3s;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:14px;
    }

    .month{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
    }

    .days{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:6px;
      margin-top:8px;
    }

    .day{
      height:34px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      border:1px solid var(--border);
      cursor:pointer;
    }
    .day.marked{
      background:var(--accent);
      border-color:var(--accent);
    }
    .empty{visibility:hidden}
  </style>
</head>

<body>
<div class="wrap">
  <h1>Calendrier Sobriété Chic 2026</h1>
  <p>Cliquez sur un jour pour le colorer</p>

  <div class="panel">
    <strong><span id="total">0</span> jours sans alcool</strong>
    <div class="stars">
      <span id="s1">★</span>
      <span id="s2">★</span>
      <span id="s3">★</span>
      <span id="s4">★</span>
      <span id="s5">★</span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p id="next"></p>
    <button id="reset">Réinitialiser</button>
  </div>

  <div class="grid" id="calendar"></div>
</div>

<script>
(function(){
  const YEAR = 2026;
  const KEY = "sobriete_2026";

  /* ---------- STORAGE SAFE (iframe compatible) ---------- */
  function setCookie(name,value,days){
    const d=new Date(Date.now()+days*864e5).toUTCString();
    document.cookie=`${name}=${encodeURIComponent(value)};expires=${d};path=/;SameSite=None;Secure`;
  }
  function getCookie(name){
    return document.cookie.split("; ").find(r=>r.startsWith(name+"="))?.split("=")[1];
  }
  function storageGet(k){
    try{ return localStorage.getItem(k); }catch(e){}
    return getCookie(k);
  }
  function storageSet(k,v){
    try{ localStorage.setItem(k,v); return; }catch(e){}
    setCookie(k,v,365);
  }
  function storageRemove(k){
    try{ localStorage.removeItem(k); }catch(e){}
    setCookie(k,"",-1);
  }

  let marked = new Set(JSON.parse(storageGet(KEY) || "[]"));

  const milestones=[7,15,30,45,60];

  const totalEl=document.getElementById("total");
  const fillEl=document.getElementById("fill");
  const nextEl=document.getElementById("next");
  const stars=[s1,s2,s3,s4,s5];

  function updateUI(){
    const t=marked.size;
    totalEl.textContent=t;

    stars.forEach((s,i)=>s.classList.toggle("on",t>=milestones[i]));

    const next=milestones.find(m=>t<m);
    if(next){
      fillEl.style.width=(t/next*100)+"%";
      nextEl.textContent=`Prochaine étoile à ${next} jours`;
    }else{
      fillEl.style.width="100%";
      nextEl.textContent="Toutes les étoiles sont obtenues ✨";
    }
  }

  function build(){
    const cal=document.getElementById("calendar");
    const months=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
    cal.innerHTML="";

    months.forEach((m,mi)=>{
      const box=document.createElement("div");
      box.className="month";
      box.innerHTML=`<strong>${m}</strong><div class="days"></div>`;
      const days=box.querySelector(".days");

      const first=new Date(YEAR,mi,1).getDay()||7;
      for(let i=1;i<first;i++)days.appendChild(document.createElement("div")).className="empty";

      const totalDays=new Date(YEAR,mi+1,0).getDate();
      for(let d=1;d<=totalDays;d++){
        const id=`${YEAR}-${mi+1}-${d}`;
        const el=document.createElement("div");
        el.className="day"+(marked.has(id)?" marked":"");
        el.textContent=d;
        el.onclick=()=>{
          marked.has(id)?marked.delete(id):marked.add(id);
          storageSet(KEY,JSON.stringify([...marked]));
          el.classList.toggle("marked");
          updateUI();
        };
        days.appendChild(el);
      }
      cal.appendChild(box);
    });
  }

  document.getElementById("reset").onclick=()=>{
    if(confirm("Réinitialiser le calendrier ?")){
      marked.clear();
      storageRemove(KEY);
      build();
      updateUI();
    }
  };

  build();
  updateUI();
})();
</script>
</body>
</html>
